services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: codeconnect
      POSTGRES_PASSWORD: codeconnect
      POSTGRES_DB: codeconnect
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U codeconnect -d codeconnect']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
